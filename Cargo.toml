[package]
name = "obsession"
version = "0.1.0"
edition = "2024"

[dependencies]
csv = "1.4.0"
regex = "1.13.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "gzip", "brotli", "rustls", "charset", "http2"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
